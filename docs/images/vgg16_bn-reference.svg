<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1083" viewBox="0 0 1120 1083" role="img" aria-labelledby="title desc">
<title id="title">VGG16＋BN：原 VGG 基準 參考架構</title>
<desc id="desc">依論文或官方參考重繪的階段概覽；右側列本專案差異。非完整逐算子計算圖。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0071e3"/></marker></defs>
<rect width="1120" height="1083" rx="24" fill="#f5f5f7"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang TC,Microsoft JhengHei,sans-serif" fill="#1d1d1f">
<text x="36" y="52" font-size="29" font-weight="600">VGG16＋BN：原 VGG 基準</text>
<text x="36" y="86" font-size="16" fill="#68686f">VGG Table 1；BN 為另加的變體</text>
<text x="36" y="117" font-size="16" fill="#68686f">參考架構階段概覽 · 左側依來源重繪；右側為本專案調整</text>
<rect x="36" y="150" width="670" height="78" rx="16" fill="#edf5ff" stroke="#d7dce2"/>
<text x="371" y="181" text-anchor="middle" font-size="21" font-weight="500">輸入</text>
<text x="371" y="208" text-anchor="middle" font-size="16" fill="#68686f">224×224 RGB</text>
<path d="M371 228 V247" stroke="#0071e3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="251" width="670" height="78" rx="16" fill="#fff" stroke="#d7dce2"/>
<text x="371" y="282" text-anchor="middle" font-size="21" font-weight="500">Block 1 · Conv 3×3 / 64 ×2</text>
<text x="371" y="309" text-anchor="middle" font-size="16" fill="#68686f">ReLU → MaxPool 2×2 / s2</text>
<path d="M371 329 V348" stroke="#0071e3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="352" width="670" height="78" rx="16" fill="#fff" stroke="#d7dce2"/>
<text x="371" y="383" text-anchor="middle" font-size="21" font-weight="500">Block 2 · Conv 3×3 / 128 ×2</text>
<text x="371" y="410" text-anchor="middle" font-size="16" fill="#68686f">ReLU → MaxPool 2×2 / s2</text>
<path d="M371 430 V449" stroke="#0071e3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="453" width="670" height="78" rx="16" fill="#fff" stroke="#d7dce2"/>
<text x="371" y="484" text-anchor="middle" font-size="21" font-weight="500">Block 3 · Conv 3×3 / 256 ×3</text>
<text x="371" y="511" text-anchor="middle" font-size="16" fill="#68686f">ReLU → MaxPool 2×2 / s2</text>
<path d="M371 531 V550" stroke="#0071e3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="554" width="670" height="78" rx="16" fill="#fff" stroke="#d7dce2"/>
<text x="371" y="585" text-anchor="middle" font-size="21" font-weight="500">Block 4 · Conv 3×3 / 512 ×3</text>
<text x="371" y="612" text-anchor="middle" font-size="16" fill="#68686f">ReLU → MaxPool 2×2 / s2</text>
<path d="M371 632 V651" stroke="#0071e3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="655" width="670" height="78" rx="16" fill="#fff" stroke="#d7dce2"/>
<text x="371" y="686" text-anchor="middle" font-size="21" font-weight="500">Block 5 · Conv 3×3 / 512 ×3</text>
<text x="371" y="713" text-anchor="middle" font-size="16" fill="#68686f">ReLU → MaxPool 2×2 / s2</text>
<path d="M371 733 V752" stroke="#0071e3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="756" width="670" height="78" rx="16" fill="#fff" stroke="#d7dce2"/>
<text x="371" y="787" text-anchor="middle" font-size="21" font-weight="500">FC 4096 → FC 4096</text>
<text x="371" y="814" text-anchor="middle" font-size="16" fill="#68686f">ReLU；兩個隱藏 FC 使用 Dropout</text>
<path d="M371 834 V853" stroke="#0071e3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="857" width="670" height="78" rx="16" fill="#edf5ff" stroke="#d7dce2"/>
<text x="371" y="888" text-anchor="middle" font-size="21" font-weight="500">FC 1000 → Softmax</text>
<text x="371" y="915" text-anchor="middle" font-size="16" fill="#68686f">Configuration D：13 Conv＋3 FC</text>
<rect x="732" y="150" width="352" height="368" rx="18" fill="#fff" stroke="#d7dce2"/>
<text x="754" y="189" font-size="22" font-weight="600">本專案差異與重點</text>
<text x="754" y="230" font-size="16">本圖是原 VGG16，不含 BN。</text>
<text x="754" y="274" font-size="16">本專案在各 Conv 後加 BN，再 ReLU。</text>
<text x="754" y="318" font-size="16">BN 不是 2014 VGG 原論文配置。</text>
<text x="754" y="362" font-size="16">本專案 FC 為 512／512。</text>
<text x="754" y="406" font-size="16">另一份 VGG16 的 FC 是 256／256。</text>
<text x="754" y="450" font-size="16">兩版本並非只改 BN 的單變項對照。</text>
<text x="36" y="1038" font-size="15" fill="#68686f">僅整理主要階段；分支／捷徑以文字標示。完整連接、超參數與細節請查來源。</text>
<text x="36" y="1063" font-size="14" fill="#68686f">原始任務的輸入／分類數與本專案不同；本圖不是本專案權重的逐層摘要。</text>
</g></svg>